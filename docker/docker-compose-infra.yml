# =============================================================================
# ChargeOS 基础设施编排（仅 Nacos / MySQL / Redis）
# 用途：端到端启动验证。先把这三件套拉起，再用 `java -jar` / `mvn` / 应用镜像
#       启动各 Spring Boot 微服务（它们通过 cloud-net 以服务名 hcp-nacos / hcp-mysql / hcp-redis 互访）。
# 说明：复用 docker/docker-compose.yml 中的 cloud-net 网络，因此可与完整编排共存。
#       本文件不依赖任何自定义 build 上下文，直接使用官方镜像，开箱即用。
# 使用：docker compose -f docker-compose-infra.yml up -d
#       停止：docker compose -f docker-compose-infra.yml down
# 注意：实际口令/密钥请通过 .env 或 shell 环境变量注入，勿写死在文件中。
#       本文件中已不再保留任何口令默认值，未提供 .env 时容器将因缺少必需变量而无法启动。
# =============================================================================
version: '3.8'

networks:
  cloud-net:
    name: cloud-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16

services:
  # ---------------------------------------------------------------- MySQL ----
  hcp-mysql:
    container_name: hcp-mysql
    image: mysql:8.0
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+8:00
      - --lower-case-table-names=1
    environment:
      # 业务默认库占位；真正的业务库(hcp_cloud/vhcp_config 等)与 Nacos 库(nacos_config)由 init SQL 自建
      MYSQL_DATABASE: 'hcp_cloud'
      # 强口令：生产务必用环境变量 MYSQL_ROOT_PASSWORD 注入随机强口令（文件内不再保留默认值）
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - ./mysql-infra/data:/var/lib/mysql
      # 把初始化 SQL 放到此目录（见下方“初始化步骤”），容器首次启动会按顺序执行
      - ./mysql-infra/init:/docker-entrypoint-initdb.d:ro
    ports:
      # 仅绑定本机回环，便于宿主机运维；生产用云 RDS 时移除映射
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      cloud-net:
        ipv4_address: 172.18.0.2

  # ----------------------------------------------------------------- Redis ----
  hcp-redis:
    container_name: hcp-redis
    image: redis:7-alpine
    # 启用 requirepass（生产务必用环境变量 REDIS_PASSWORD 注入随机强口令，文件内不再保留默认值）
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - ./redis-infra/data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      cloud-net:
        ipv4_address: 172.18.0.3

  # ----------------------------------------------------------------- Nacos ----
  hcp-nacos:
    container_name: hcp-nacos
    # 务必与微服务使用的 nacos-client 版本保持一致（nacos-client 由 spring-cloud-alibaba 2023.0.3.2 BOM 管理为 2.3.x），否则 gRPC 协议不兼容
    image: nacos/nacos-server:v2.3.2
    environment:
      - MODE=standalone
      # —— 安全加固（呼应 P2）：开启 Nacos 鉴权 ——
      - NACOS_AUTH_ENABLE=true
      # token 必须是 base64 且长度 >= 32 字节；用 `openssl rand -base64 32` 生成后通过环境变量注入（文件内不再保留默认值，生产必须替换）
      - NACOS_AUTH_TOKEN=${NACOS_AUTH_TOKEN}
      - NACOS_AUTH_IDENTITY_KEY=${NACOS_AUTH_IDENTITY_KEY}
      - NACOS_AUTH_IDENTITY_VALUE=${NACOS_AUTH_IDENTITY_VALUE}
      # —— 持久化到外部 MySQL（vhcp_config 库，与 sql/hcp_config.sql 自建的库名一致），这样配置才能被加载 ——
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=hcp-mysql
      - MYSQL_SERVICE_DB_NAME=vhcp_config
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - JVM_XMS=512m
      - JVM_XMX=512m
      - TZ=Asia/Shanghai
    volumes:
      - ./nacos-infra/logs:/home/nacos/logs
    ports:
      # 仅绑定本机回环，不暴露公网；运维从宿主机访问即可
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"   # gRPC 客户端通信端口
      - "127.0.0.1:9849:9849"   # gRPC 集群通信端口
    depends_on:
      hcp-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8848/nacos/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      cloud-net:
        ipv4_address: 172.18.0.6
