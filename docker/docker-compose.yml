version : '3.8'
networks:
  cloud-net:
    name: cloud-net
    ipam:
      config:
        - subnet: 172.18.0.0/16
services:
  hcp-nacos:
    container_name: hcp-nacos
    image: nacos/nacos-server:2.1.1
    build:
      context: ./nacos
    environment:
      - MODE=standalone
      # —— 安全加固（呼应 P2）：开启 Nacos 鉴权；与 docker-compose-infra.yml 保持一致 ——
      # Nacos 官方镜像会把 NACOS_* 环境变量追加到挂载的 application.properties 之后，故此处值会覆盖文件里写死的密钥
      - NACOS_AUTH_ENABLE=true
      # token 必须是 base64 且长度 >= 32 字节；用 `openssl rand -base64 32` 生成，
      # 必须通过 .env 的 NACOS_AUTH_TOKEN 注入，生产务必替换为随机值（文件内不再保留默认值）
      - NACOS_AUTH_TOKEN=${NACOS_AUTH_TOKEN}
      - NACOS_AUTH_IDENTITY_KEY=${NACOS_AUTH_IDENTITY_KEY}
      - NACOS_AUTH_IDENTITY_VALUE=${NACOS_AUTH_IDENTITY_VALUE}
      # —— 持久化到外部 MySQL（vhcp_config 库，与 sql/hcp_config.sql 自建库名一致）；
      #    此处用 env 覆盖挂载的 application.properties 里写死的 db.password，规避明文密码提交 ——
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=hcp-mysql
      - MYSQL_SERVICE_DB_NAME=vhcp_config
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - JVM_XMS=512m
      - JVM_XMX=512m
      - TZ=Asia/Shanghai
    volumes:
      - ./nacos/logs/:/home/nacos/logs
      - ./nacos/conf/application.properties:/home/nacos/conf/application.properties
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    depends_on:
      - hcp-mysql
    networks:
      cloud-net:
        ipv4_address: 172.18.0.6
  hcp-mysql:
    container_name: hcp-mysql
    image: mysql:8.0.36
    build:
      context: ./mysql
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/conf:/etc/mysql/conf.d
      - ./mysql/logs:/logs
      - ./mysql/data:/var/lib/mysql
      - ./mysql/db:/docker-entrypoint-initdb.d
    command: [
      'mysqld',
      '--innodb-buffer-pool-size=80M',
      '--character-set-server=utf8mb4',
      '--collation-server=utf8mb4_unicode_ci',
      '--default-time-zone=+8:00',
      '--lower-case-table-names=1'
    ]
    environment:
      # 应用实际使用的业务库为 vctgo_platform（保留远端既有配置）；Nacos 配置库为 vhcp_config（由对应 SQL 脚本自建）
      MYSQL_DATABASE: 'vctgo_platform'
      # 强口令：必须通过 .env 的 MYSQL_ROOT_PASSWORD 注入随机强口令（文件内不再保留默认值）
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    networks:
      cloud-net:
        ipv4_address: 172.18.0.2
  hcp-redis:
    container_name: hcp-redis
    image: redis:7-alpine
    build:
      context: ./redis
    # 仅绑定本机回环，便于宿主机运维；生产建议用云 Redis 并移除映射
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./redis/conf/redis.conf:/home/hcp/redis/redis.conf
      - ./redis/data:/data
    command: redis-server /home/hcp/redis/redis.conf --requirepass ${REDIS_PASSWORD}
    networks:
      cloud-net:
        ipv4_address: 172.18.0.3
  hcp-nginx:
    container_name: hcp-nginx
    image: nginx:1.27-alpine
    build:
      context: ./nginx
    ports:
      - "8001:8001"
    volumes:
      - ./nginx/html/dist:/home/hcp/projects/hcp-ui
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/logs:/var/log/nginx
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - hcp-gateway
    links:
      - hcp-gateway
    networks:
      cloud-net:
        ipv4_address: 172.18.0.4
  hcp-gateway:
    container_name: hcp-gateway
    build:
      context: hcp/gateway
      dockerfile: dockerfile
    ports:
      - "38080:38080"
    depends_on:
      - hcp-redis
    links:
      - hcp-redis
    environment:
      - NACOS_HOST=172.18.0.6
      - NACOS_PORT=8848
      - NETWORK_IP=${DEPLOY_IP:-192.168.1.4}
      - JWT_SECRET=${JWT_SECRET}
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - JASYPT_ENCRYPTOR_PASSWORD=${JASYPT_ENCRYPTOR_PASSWORD}
      - JASYPT_ENCRYPTOR_PASSWORD_PREV=${JASYPT_ENCRYPTOR_PASSWORD_PREV:-}
    networks:
      cloud-net:
        ipv4_address: 172.18.0.5
  hcp-auth:
    container_name: hcp-auth
    build:
      context: hcp/auth
      dockerfile: dockerfile
    ports:
      - "39200:39200"
    depends_on:
      - hcp-redis
    links:
      - hcp-redis
    environment:
      - NACOS_HOST=172.18.0.6
      - NACOS_PORT=8848
      - NETWORK_IP=${DEPLOY_IP:-192.168.1.4}
      - JWT_SECRET=${JWT_SECRET}
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - JASYPT_ENCRYPTOR_PASSWORD=${JASYPT_ENCRYPTOR_PASSWORD}
      - JASYPT_ENCRYPTOR_PASSWORD_PREV=${JASYPT_ENCRYPTOR_PASSWORD_PREV:-}
    networks:
      cloud-net:
        ipv4_address: 172.18.0.7
  hcp-system:
    container_name: hcp-system
    build:
      context: hcp/modules/system
      dockerfile: dockerfile
    ports:
      - "39201:39201"
    depends_on:
      - hcp-redis
      - hcp-mysql
    links:
      - hcp-redis
      - hcp-mysql
      - hcp-file
    environment:
      - NACOS_HOST=172.18.0.6
      - NACOS_PORT=8848
      - NETWORK_IP=${DEPLOY_IP:-192.168.1.4}
      - JWT_SECRET=${JWT_SECRET}
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - JASYPT_ENCRYPTOR_PASSWORD=${JASYPT_ENCRYPTOR_PASSWORD}
      - JASYPT_ENCRYPTOR_PASSWORD_PREV=${JASYPT_ENCRYPTOR_PASSWORD_PREV:-}
    networks:
      cloud-net:
        ipv4_address: 172.18.0.8
  hcp-gen:
    container_name: hcp-gen
    build:
      context: hcp/modules/gen
      dockerfile: dockerfile
    ports:
      - "39202:39202"
    depends_on:
      - hcp-mysql
    links:
      - hcp-mysql
    environment:
      - NACOS_HOST=172.18.0.6
      - NACOS_PORT=8848
      - NETWORK_IP=${DEPLOY_IP:-192.168.1.4}
      - JWT_SECRET=${JWT_SECRET}
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - JASYPT_ENCRYPTOR_PASSWORD=${JASYPT_ENCRYPTOR_PASSWORD}
      - JASYPT_ENCRYPTOR_PASSWORD_PREV=${JASYPT_ENCRYPTOR_PASSWORD_PREV:-}
    networks:
      cloud-net:
        ipv4_address: 172.18.0.9
  hcp-file:
    container_name: hcp-file
    build:
      context: hcp/modules/file
      dockerfile: dockerfile
    ports:
      - "39300:39300"
    volumes:
      - ./vctgo/uploadPath:/home/hcp/uploadPath
    environment:
      - NACOS_HOST=172.18.0.6
      - NACOS_PORT=8848
      - NETWORK_IP=${DEPLOY_IP:-192.168.1.4}
      - JWT_SECRET=${JWT_SECRET}
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - JASYPT_ENCRYPTOR_PASSWORD=${JASYPT_ENCRYPTOR_PASSWORD}
      - JASYPT_ENCRYPTOR_PASSWORD_PREV=${JASYPT_ENCRYPTOR_PASSWORD_PREV:-}
    networks:
      cloud-net:
        ipv4_address: 172.18.0.10
  hcp-monitor:
    container_name: hcp-monitor
    build:
      context: hcp/visual/monitor
      dockerfile: dockerfile
    ports:
      - "39100:39100"
    environment:
      - NACOS_HOST=172.18.0.6
      - NACOS_PORT=8848
      - NETWORK_IP=${DEPLOY_IP:-192.168.1.4}
      - JWT_SECRET=${JWT_SECRET}
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - JASYPT_ENCRYPTOR_PASSWORD=${JASYPT_ENCRYPTOR_PASSWORD}
      - JASYPT_ENCRYPTOR_PASSWORD_PREV=${JASYPT_ENCRYPTOR_PASSWORD_PREV:-}
    networks:
      cloud-net:
        ipv4_address: 172.18.0.11
  hcp-demo:
    container_name: hcp-demo
    build:
      context: hcp/demo
      dockerfile: dockerfile
    ports:
      - "39203:39203"
    depends_on:
      - hcp-redis
      - hcp-mysql
    links:
      - hcp-redis
      - hcp-mysql
      - hcp-file
    environment:
      - NACOS_HOST=172.18.0.6
      - NACOS_PORT=8848
      - NETWORK_IP=${DEPLOY_IP:-192.168.1.4}
      - JWT_SECRET=${JWT_SECRET}
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - JASYPT_ENCRYPTOR_PASSWORD=${JASYPT_ENCRYPTOR_PASSWORD}
      - JASYPT_ENCRYPTOR_PASSWORD_PREV=${JASYPT_ENCRYPTOR_PASSWORD_PREV:-}
    networks:
      cloud-net:
        ipv4_address: 172.18.0.12
  hcp-job:
    container_name: hcp-job
    build:
      context: hcp/modules/job
      dockerfile: dockerfile
    ports:
      - "39204:39204"
    depends_on:
      - hcp-redis
      - hcp-mysql
    links:
      - hcp-redis
      - hcp-mysql
      - hcp-file
    environment:
      - NACOS_HOST=172.18.0.6
      - NACOS_PORT=8848
      - NETWORK_IP=${DEPLOY_IP:-192.168.1.4}
      - JWT_SECRET=${JWT_SECRET}
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - JASYPT_ENCRYPTOR_PASSWORD=${JASYPT_ENCRYPTOR_PASSWORD}
      - JASYPT_ENCRYPTOR_PASSWORD_PREV=${JASYPT_ENCRYPTOR_PASSWORD_PREV:-}
    networks:
      cloud-net:
        ipv4_address: 172.18.0.13
